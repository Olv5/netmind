<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetMind</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0c0f;
    --surface: #111318;
    --surface2: #1a1d24;
    --border: #1f2330;
    --border2: #2a2f40;
    --accent: #00d4ff;
    --accent2: #7b61ff;
    --weak: #ff3b5c;
    --ok: #10b981;
    --warn: #f59e0b;
    --text: #e2e8f0;
    --text2: #8892a4;
    --text3: #4a5568;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1000; opacity: 0.4;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .app { display: flex; height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 260px; min-width: 260px; background: var(--surface);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden; z-index: 100;
  }
  .logo { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .logo-text { font-family: var(--sans); font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .logo-text span { color: var(--accent); }
  .logo-sub { font-size: 9px; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

  .nav { padding: 10px 10px 0; }
  .nav-btn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border-radius: 6px; border: none; background: none;
    color: var(--text2); font-family: var(--mono); font-size: 11px; cursor: pointer;
    transition: all 0.15s; text-align: left; margin-bottom: 2px;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--surface2); color: var(--accent); }
  .nav-btn .icon { font-size: 13px; }

  .topics-section { flex: 1; overflow-y: auto; padding: 8px 0; }
  .section-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); padding: 8px 20px 4px; }

  .topic-item { }
  .topic-header {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 16px; cursor: pointer;
    transition: background 0.15s; font-size: 11px; color: var(--text2);
  }
  .topic-header:hover { background: var(--surface2); }
  .topic-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); flex-shrink: 0; }
  .topic-dot.has-items { background: var(--accent); }
  .topic-chevron { font-size: 8px; color: var(--text3); transition: transform 0.2s; margin-left: auto; }
  .topic-item.open .topic-chevron { transform: rotate(90deg); }
  .topic-folders { display: none; padding: 2px 0 4px 0; }
  .topic-item.open .topic-folders { display: block; }

  .folder-row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 28px; cursor: pointer;
    font-size: 10px; color: var(--text3); transition: all 0.15s;
  }
  .folder-row:hover { background: var(--surface2); color: var(--text2); }
  .folder-row.active { color: var(--accent); }
  .folder-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .folder-count {
    margin-left: auto; font-size: 9px; color: var(--text3);
    background: var(--surface2); padding: 1px 5px; border-radius: 3px;
  }
  .folder-count.has-due { background: rgba(0,212,255,0.1); color: var(--accent); }

  .del-btn {
    background: none; border: none; color: transparent; font-size: 14px;
    cursor: pointer; padding: 0 2px; line-height: 1; transition: color 0.15s; flex-shrink: 0;
  }
  .topic-header:hover .del-btn { color: var(--text3); }
  .del-btn:hover { color: var(--weak) !important; }

  .topic-review-btn {
    background: none; border: none; color: transparent; font-size: 13px;
    cursor: pointer; padding: 0 3px; line-height: 1; transition: color 0.15s; flex-shrink: 0;
  }
  .topic-header:hover .topic-review-btn { color: var(--text3); }
  .topic-review-btn:hover { color: var(--accent) !important; }

  .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
  .add-btn {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 8px 12px; border-radius: 6px; border: 1px dashed var(--border2);
    background: none; color: var(--text3); font-family: var(--mono); font-size: 11px;
    cursor: pointer; transition: all 0.15s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
  }
  .topbar-left { display: flex; align-items: center; gap: 4px; }
  .topbar-title { font-family: var(--sans); font-size: 16px; font-weight: 700; }
  .topbar-path { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .review-trigger { display: flex; align-items: center; gap: 10px; }
  .queue-badge {
    font-size: 10px; padding: 3px 8px; border-radius: 4px;
    background: rgba(0,212,255,0.1); color: var(--accent);
    border: 1px solid rgba(0,212,255,0.2); display: none;
  }
  .queue-badge.visible { display: block; }
  .btn-review {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent);
    background: rgba(0,212,255,0.08); color: var(--accent); font-family: var(--mono);
    font-size: 12px; cursor: pointer; transition: all 0.2s;
  }
  .btn-review:hover { background: rgba(0,212,255,0.15); }

  .content { flex: 1; overflow-y: auto; padding: 28px; }

  .view { display: none; }
  .view.active { display: block; }

  /* DASHBOARD */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
  }
  .stat-label { font-size: 10px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-family: var(--sans); font-size: 28px; font-weight: 800; }
  .stat-value.accent { color: var(--accent); }
  .stat-value.weak { color: var(--weak); }
  .stat-value.ok { color: var(--ok); }

  .section-title {
    font-family: var(--sans); font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; color: var(--text3);
    margin-bottom: 12px; margin-top: 4px;
  }

  .queue-list { display: flex; flex-direction: column; gap: 6px; }
  .queue-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .queue-item:hover { border-color: var(--border2); transform: translateX(2px); }
  .queue-item-left { flex: 1; min-width: 0; }
  .queue-item-name { font-size: 12px; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-item-sub { font-size: 10px; color: var(--text3); }
  .queue-item-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .priority-bar { width: 60px; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .priority-fill { height: 100%; border-radius: 2px; background: var(--text3); }
  .priority-fill.hi { background: var(--weak); }
  .priority-fill.mid { background: var(--warn); }
  .type-tag {
    font-size: 9px; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.5px;
    text-transform: uppercase; white-space: nowrap;
  }
  .type-tag.atomic    { background: rgba(0,212,255,0.1);  color: var(--accent);  border: 1px solid rgba(0,212,255,0.15); }
  .type-tag.process   { background: rgba(245,158,11,0.1); color: var(--warn);    border: 1px solid rgba(245,158,11,0.15); }
  .type-tag.problem   { background: rgba(255,59,92,0.1);  color: var(--weak);    border: 1px solid rgba(255,59,92,0.15); }
  .type-tag.reconstruction { background: rgba(123,97,255,0.1); color: var(--accent2); border: 1px solid rgba(123,97,255,0.15); }

  /* ITEM LIST VIEW */
  .item-list-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .item-list-title {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--sans); font-size: 18px; font-weight: 700;
  }
  .type-badge {
    font-size: 9px; padding: 3px 8px; border-radius: 4px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .type-badge.atomic        { background: rgba(0,212,255,0.1);  color: var(--accent);  border: 1px solid rgba(0,212,255,0.2); }
  .type-badge.process       { background: rgba(245,158,11,0.1); color: var(--warn);    border: 1px solid rgba(245,158,11,0.2); }
  .type-badge.problem       { background: rgba(255,59,92,0.1);  color: var(--weak);    border: 1px solid rgba(255,59,92,0.2); }
  .type-badge.reconstruction{ background: rgba(123,97,255,0.1); color: var(--accent2); border: 1px solid rgba(123,97,255,0.2); }

  .item-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.15s;
  }
  .item-card:hover { border-color: var(--border2); }
  .item-card-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 14px 16px; gap: 12px; cursor: pointer;
  }
  .item-card-question { font-size: 13px; color: var(--text); flex: 1; line-height: 1.6; }
  .item-card-actions { display: flex; gap: 4px; flex-shrink: 0; margin-top: 2px; }
  .item-action-btn {
    background: none; border: none; color: var(--text3); font-size: 11px;
    cursor: pointer; padding: 3px 7px; border-radius: 4px; transition: all 0.15s;
    font-family: var(--mono);
  }
  .item-action-btn:hover { color: var(--text); background: var(--surface2); }
  .item-action-btn.del:hover { color: var(--weak); }
  .item-card-meta {
    display: flex; gap: 8px; align-items: center;
    padding: 0 16px 10px; font-size: 10px; color: var(--text3);
  }
  .due-tag {
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    background: rgba(0,212,255,0.08); color: var(--accent);
    border: 1px solid rgba(0,212,255,0.15);
  }
  .due-tag.new-tag { background: var(--surface2); color: var(--text3); border-color: var(--border2); }
  .due-tag.due-now { background: rgba(255,59,92,0.08); color: var(--weak); border-color: rgba(255,59,92,0.2); }
  .item-card-answer {
    display: none; padding: 14px 16px; font-size: 12px; color: var(--text2);
    line-height: 1.8; border-top: 1px solid var(--border); white-space: pre-wrap;
    background: var(--surface2);
  }
  .item-card.open .item-card-answer { display: block; }
  .item-tag-label {
    font-size: 9px; color: var(--text3); background: var(--surface2);
    padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border2);
  }

  /* REVIEW */
  .review-container { max-width: 680px; margin: 0 auto; }
  .review-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .progress-bar { flex: 1; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
  .progress-text { font-size: 11px; color: var(--text3); white-space: nowrap; }

  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .review-card-top { padding: 22px 24px 20px; border-bottom: 1px solid var(--border); }
  .review-type {
    display: inline-block; font-size: 9px; padding: 3px 10px; border-radius: 4px;
    letter-spacing: 1.5px; margin-bottom: 14px; border: 1px solid;
  }
  .review-type.t-atomic        { background: rgba(0,212,255,0.1);  color: var(--accent);  border-color: rgba(0,212,255,0.2); }
  .review-type.t-process       { background: rgba(245,158,11,0.1); color: var(--warn);    border-color: rgba(245,158,11,0.2); }
  .review-type.t-problem       { background: rgba(255,59,92,0.1);  color: var(--weak);    border-color: rgba(255,59,92,0.2); }
  .review-type.t-reconstruction{ background: rgba(123,97,255,0.1); color: var(--accent2); border-color: rgba(123,97,255,0.2); }

  .review-prompt { font-family: var(--sans); font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
  .review-context { font-size: 11px; color: var(--text3); }

  .review-card-body { padding: 20px 24px; }
  .review-textarea {
    width: 100%; min-height: 120px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 14px; resize: vertical; outline: none; line-height: 1.7;
    transition: border-color 0.2s;
  }
  .review-textarea:focus { border-color: var(--border2); }
  .review-actions { display: flex; gap: 10px; margin-top: 12px; }
  .btn-reveal {
    padding: 9px 18px; border-radius: 6px; border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text2); font-family: var(--mono);
    font-size: 11px; cursor: pointer; transition: all 0.2s;
  }
  .btn-reveal:hover { border-color: var(--accent); color: var(--accent); }
  .btn-skip {
    padding: 9px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: none; color: var(--text3); font-family: var(--mono);
    font-size: 11px; cursor: pointer; transition: all 0.2s;
  }
  .btn-skip:hover { color: var(--text2); border-color: var(--border2); }

  .grade-section { display: none; margin-top: 16px; }
  .grade-section.visible { display: block; }
  .reference-answer {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; font-size: 12px; color: var(--text2); line-height: 1.8;
    white-space: pre-wrap; margin-bottom: 16px;
  }
  .grade-label-top { font-size: 10px; color: var(--text3); margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .grade-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grade-btn {
    padding: 10px 8px; border-radius: 8px; border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text2); font-family: var(--mono);
    font-size: 11px; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .grade-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); }
  .grade-btn .gl { display: block; font-weight: 700; margin-bottom: 3px; }
  .grade-btn .gd { display: block; font-size: 9px; color: var(--text3); }

  .review-done { display: none; text-align: center; padding: 40px 20px; }
  .review-done.visible { display: block; }
  .done-icon { font-size: 32px; margin-bottom: 12px; }
  .done-title { font-family: var(--sans); font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .done-sub { font-size: 12px; color: var(--text3); line-height: 1.9; white-space: pre-wrap; }

  /* STATS */
  .stats-highlight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .stats-highlight-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .stats-highlight-box-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3);
    display: flex; align-items: center; gap: 8px;
  }
  .stats-highlight-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .stats-highlight-item:last-child { border-bottom: none; }
  .stats-highlight-item:hover { background: var(--surface2); }
  .shi-name { font-size: 12px; color: var(--text); }
  .shi-topic { font-size: 10px; color: var(--text3); margin-top: 2px; }
  .shi-count { font-family: var(--sans); font-size: 16px; font-weight: 700; color: var(--accent); min-width: 28px; text-align: right; }
  .shi-count.neglected { color: var(--weak); }

  .topic-stat-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .topic-stat-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.15s; }
  .topic-stat-header:hover { background: var(--surface2); }
  .topic-stat-name { font-family: var(--sans); font-size: 14px; font-weight: 700; }
  .topic-stat-summary { display: flex; gap: 16px; font-size: 11px; color: var(--text3); }
  .topic-stat-body { display: none; border-top: 1px solid var(--border); }
  .topic-stat-block.open .topic-stat-body { display: block; }
  .topic-stat-chevron { font-size: 10px; color: var(--text3); transition: transform 0.2s; }
  .topic-stat-block.open .topic-stat-chevron { transform: rotate(90deg); }

  .type-stat-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 18px; border-bottom: 1px solid var(--border);
  }
  .type-stat-row:last-child { border-bottom: none; }
  .type-stat-label { font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .type-stat-nums { display: flex; gap: 20px; font-size: 11px; color: var(--text3); }
  .type-stat-nums span { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .type-stat-nums strong { font-size: 14px; font-family: var(--sans); font-weight: 700; color: var(--text); }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 500; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; padding: 24px; width: 100%; max-width: 520px;
    max-height: 85vh; overflow-y: auto; margin: 20px;
  }
  .modal-title {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--sans); font-size: 15px; font-weight: 700; margin-bottom: 20px;
  }
  .modal-close { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; }
  .modal-close:hover { color: var(--text); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 10px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--border2);
    border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 10px 12px; outline: none; transition: border-color 0.2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { min-height: 100px; resize: vertical; line-height: 1.7; }
  .field select option { background: var(--surface); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn-cancel {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border2);
    background: none; color: var(--text3); font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .btn-save {
    padding: 8px 20px; border-radius: 6px; border: 1px solid var(--accent);
    background: rgba(0,212,255,0.1); color: var(--accent); font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .hint { font-size: 11px; color: var(--text3); line-height: 1.7; margin-top: -8px; margin-bottom: 12px; }

  /* MOBILE */
  .hamburger {
    display: none; background: none; border: none; color: var(--text2);
    font-size: 20px; cursor: pointer; padding: 4px 8px; margin-right: 4px; line-height: 1;
  }
  .sidebar-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; backdrop-filter: blur(2px);
  }
  .sidebar-backdrop.visible { display: block; }

  .empty-state { padding: 40px 20px; text-align: center; color: var(--text3); font-size: 12px; line-height: 1.9; }
  .empty-state-icon { font-size: 28px; margin-bottom: 12px; }

  @media (max-width: 768px) {
    .hamburger { display: block; }
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 300;
      transform: translateX(-100%); transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .topbar { padding: 12px 16px; }
    .content { padding: 20px 16px; }

<script>
// ============================================================
// SUPABASE CONFIG — paste your keys here
// ============================================================
const SUPABASE_URL = 'https://rmcghljmwtzbykyqeoim.supabase.co/';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtY2dobGptd3R6YnlreXFlb2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NzQ3OTEsImV4cCI6MjA4NzM1MDc5MX0.2r1loObmpbrDSpzBaUK-H-djQmODyK0WbfxarJPn6gc';

const SB = {
  headers: {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`
  },
  async get(table, params = '') {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: this.headers });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async upsert(table, row) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: { ...this.headers, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(row)
    });
    if (!r.ok) throw new Error(await r.text());
  },
  async delete(table, id) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers: this.headers });
    if (!r.ok) throw new Error(await r.text());
  }
};

// ============================================================
// DATA MODEL
// ============================================================
let data = {
  sessionCount: 0,
  lastSessionDate: '',
  streak: 0,
  topics: [],  // [{ id, name }]
  items: []    // [{ id, topic_id, type, question, answer, tags, review }]
};

// ============================================================
// PERSISTENCE
// ============================================================
async function saveMeta() {
  await SB.upsert('topics', { id: '__meta__', name: JSON.stringify({
    sessionCount: data.sessionCount,
    lastSessionDate: data.lastSessionDate,
    streak: data.streak
  })});
}

async function saveTopic(topic) {
  await SB.upsert('topics', { id: topic.id, name: topic.name });
}

async function saveItem(item) {
  await SB.upsert('items', {
    id: item.id,
    topic_id: item.topic_id,
    type: item.type,
    question: item.question,
    answer: item.answer || '',
    tags: item.tags || [],
    review: item.review
  });
}

async function loadFromDB() {
  showLoading(true);
  try {
    const [topicRows, itemRows] = await Promise.all([
      SB.get('topics', 'order=created_at.asc'),
      SB.get('items', 'order=created_at.asc')
    ]);

    const metaRow = topicRows.find(t => t.id === '__meta__');
    if (metaRow) {
      try {
        const m = JSON.parse(metaRow.name);
        data.sessionCount    = m.sessionCount    || 0;
        data.lastSessionDate = m.lastSessionDate || '';
        data.streak          = m.streak          || 0;
      } catch(e) {}
    }

    data.topics = topicRows
      .filter(t => t.id !== '__meta__')
      .map(t => ({ id: t.id, name: t.name }));

    data.items = itemRows.map(i => ({
      id: i.id,
      topic_id: i.topic_id,
      type: i.type,
      question: i.question || '',
      answer: i.answer || '',
      tags: i.tags || [],
      review: i.review || { sessions: 0, lastSession: -1, easeScore: 2.5, interval: 1, nextReviewSession: 0 }
    }));

  } catch(e) {
    console.error(e);
    showError('Could not connect to database. Check your API keys.');
    return;
  }
  showLoading(false);
  renderSidebar();
  renderDashboard();
}

function showLoading(visible) {
  let el = document.getElementById('loadingScreen');
  if (!el) {
    el = document.createElement('div');
    el.id = 'loadingScreen';
    el.style.cssText = 'position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;font-family:var(--mono);color:var(--text3);font-size:13px;gap:12px;';
    el.innerHTML = `<div style="font-family:var(--sans);font-size:22px;font-weight:800;color:var(--text)">Net<span style="color:var(--accent)">Mind</span></div><div id="loadingMsg">Connecting...</div>`;
    document.body.appendChild(el);
  }
  el.style.display = visible ? 'flex' : 'none';
}

function showError(msg) {
  const el = document.getElementById('loadingMsg');
  if (el) { el.textContent = msg; el.style.color = 'var(--weak)'; }
  showLoading(true);
}

// ============================================================
// HELPERS
// ============================================================
function uid()  { return 'i' + Date.now() + Math.random().toString(36).slice(2,5); }
function tuid() { return 't' + Date.now(); }

function getTopicItems(topicId, type) {
  return data.items.filter(i => i.topic_id === topicId && i.type === type);
}

function getTopic(topicId) {
  return data.topics.find(t => t.id === topicId);
}

function getItem(itemId) {
  return data.items.find(i => i.id === itemId);
}

const TYPE_LABELS = {
  atomic: 'Atomic',
  process: 'Process',
  problem: 'Problem',
  reconstruction: 'Reconstruction'
};

const TYPES = ['atomic', 'process', 'problem', 'reconstruction'];

function isDue(item) {
  if (!item.review || item.review.sessions === 0) return true;
  return !item.review.nextReviewSession || data.sessionCount >= item.review.nextReviewSession;
}

function dueCount(topicId, type) {
  return getTopicItems(topicId, type).filter(isDue).length;
}

function totalDue() {
  return data.items.filter(isDue).length;
}

// ============================================================
// SM-2 SCHEDULING
// ============================================================
function nextInterval(currentInterval, ease, grade) {
  if (grade === 0) return 1;
  if (grade === 1) return Math.max(1, Math.floor(currentInterval * 1.2));
  if (grade === 2) return Math.max(1, Math.floor(currentInterval * ease));
  return Math.max(1, Math.floor(currentInterval * ease * 1.3));
}

function updateItemReview(item, grade) {
  if (!item.review) item.review = { sessions: 0, lastSession: -1, easeScore: 2.5, interval: 1, nextReviewSession: 0 };
  item.review.sessions++;
  item.review.lastSession = data.sessionCount;
  const delta = [-.4, -.15, 0, +.2][grade];
  item.review.easeScore = Math.max(1.2, Math.min(4.0, item.review.easeScore + delta));
  const ci = item.review.interval || 1;
  item.review.interval = nextInterval(ci, item.review.easeScore, grade);
  item.review.nextReviewSession = data.sessionCount + item.review.interval;
}

// ============================================================
// SESSION / STREAK
// ============================================================
function bumpSession() {
  const today = new Date().toISOString().split('T')[0];
  if (data.lastSessionDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  data.streak = data.lastSessionDate === yesterday ? data.streak + 1
    : data.lastSessionDate === '' ? 1 : 1;
  data.sessionCount++;
  data.lastSessionDate = today;
  saveMeta();
}

// ============================================================
// PRIORITY
// ============================================================
function computePriority(item) {
  const gap = data.sessionCount - (item.review?.lastSession ?? -1);
  const effectiveGap = !item.review || item.review.sessions === 0 ? 3 : gap;
  return (effectiveGap * 1.5) / (item.review?.easeScore ?? 2.5);
}

// ============================================================
// REVIEW QUEUE
// ============================================================
function buildReviewQueue(topicId = null, type = null, includeAll = false) {
  let pool = data.items;
  if (topicId) pool = pool.filter(i => i.topic_id === topicId);
  if (type)    pool = pool.filter(i => i.type === type);
  if (!includeAll) pool = pool.filter(isDue);
  return [...pool]
    .map(i => ({ ...i, priority: computePriority(i) }))
    .sort((a, b) => b.priority - a.priority);
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar() {
  const el = document.getElementById('topicsList');
  el.innerHTML = '<div class="section-label">Topics</div>';

  data.topics.forEach(topic => {
    const hasItems = data.items.some(i => i.topic_id === topic.id);
    const div = document.createElement('div');
    div.className = 'topic-item';
    div.id = 'titem-' + topic.id;

    const folders = TYPES.map(type => {
      const count = getTopicItems(topic.id, type).length;
      const due   = dueCount(topic.id, type);
      return `<div class="folder-row" onclick="showItemList('${topic.id}','${type}')">
        <div class="folder-dot" style="background:${typeColor(type)}"></div>
        <span>${TYPE_LABELS[type]}</span>
        <span class="folder-count ${due > 0 ? 'has-due' : ''}">${due > 0 ? due + ' due' : count}</span>
      </div>`;
    }).join('');

    div.innerHTML = `
      <div class="topic-header" onclick="toggleTopic('${topic.id}')">
        <div class="topic-dot ${hasItems ? 'has-items' : ''}"></div>
        <span style="flex:1">${topic.name}</span>
        <button class="topic-review-btn" onclick="event.stopPropagation();startReview('${topic.id}')" title="Review this topic">⟳</button>
        <button class="del-btn" onclick="event.stopPropagation();deleteTopic('${topic.id}')">×</button>
        <span class="topic-chevron">▶</span>
      </div>
      <div class="topic-folders" id="folders-${topic.id}">${folders}</div>`;
    el.appendChild(div);
  });
}

function toggleTopic(id) {
  document.getElementById('titem-' + id)?.classList.toggle('open');
}

function typeColor(type) {
  return { atomic: 'var(--accent)', process: 'var(--warn)', problem: 'var(--weak)', reconstruction: 'var(--accent2)' }[type] || 'var(--text3)';
}

// ============================================================
// VIEWS
// ============================================================
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name)?.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + name)?.classList.add('active');
  closeSidebar();

  if      (name === 'dashboard') { renderDashboard(); document.getElementById('topbarTitle').textContent = 'Dashboard'; document.getElementById('topbarPath').innerHTML = ''; }
  else if (name === 'stats')     { renderStats();     document.getElementById('topbarTitle').textContent = 'Stats';     document.getElementById('topbarPath').innerHTML = ''; }
  else if (name === 'review')    { document.getElementById('topbarTitle').textContent = 'Review Session'; document.getElementById('topbarPath').innerHTML = ''; }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('visible');
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const total = data.items.length;
  const due   = totalDue();

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Items</div><div class="stat-value accent">${total}</div></div>
    <div class="stat-card"><div class="stat-label">Due Now</div><div class="stat-value ${due > 0 ? 'weak' : 'ok'}">${due}</div></div>
    <div class="stat-card"><div class="stat-label">Sessions</div><div class="stat-value ok">${data.sessionCount}</div></div>
    <div class="stat-card">
      <div class="stat-label">Streak</div>
      <div class="stat-value ${data.streak >= 2 ? 'accent' : 'ok'}">${data.streak >= 2 ? '🔥' : '○'} ${data.streak}d</div>
      ${data.streak === 1 ? '<div style="font-size:10px;color:var(--text3);margin-top:2px;">keep it going</div>' : ''}
    </div>`;

  const queue = buildReviewQueue();
  const badge = document.getElementById('queueBadge');
  if (queue.length > 0) { badge.textContent = `${queue.length} due`; badge.classList.add('visible'); }
  else badge.classList.remove('visible');

  const dashQueue = document.getElementById('dashQueue');
  if (!queue.length) {
    const next = [...data.items]
      .filter(i => i.review?.nextReviewSession)
      .sort((a,b) => a.review.nextReviewSession - b.review.nextReviewSession)[0];
    const away = next ? Math.max(0, next.review.nextReviewSession - data.sessionCount) : null;
    const nextMsg = away !== null
      ? `Next item due in <strong>${away} session${away !== 1 ? 's' : ''}</strong>`
      : data.items.length === 0 ? 'Add some items to get started.' : 'No upcoming reviews scheduled.';
    dashQueue.innerHTML = `<div class="section-title">Review Queue</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:28px;text-align:center;">
        <div style="font-size:24px;margin-bottom:10px;">✓</div>
        <div style="font-family:var(--sans);font-size:15px;font-weight:700;margin-bottom:6px;">All caught up!</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:${data.items.length ? '20px' : '0'};">${nextMsg}</div>
        ${data.items.length ? `<button class="btn-review" onclick="startReview(null,null,true)" style="font-size:11px;">Review Anyway</button>` : ''}
      </div>`;
    return;
  }

  const top = queue.slice(0, 10);
  const maxP = queue[0].priority || 1;
  dashQueue.innerHTML = `
    <div class="section-title">Review Queue <span style="font-size:11px;color:var(--text3);font-weight:400;">top ${top.length} by priority</span></div>
    <div class="queue-list">${top.map(item => {
      const pct = Math.min(100, (item.priority / maxP) * 100);
      const fillCls = pct > 66 ? 'hi' : pct > 33 ? 'mid' : '';
      const topic = getTopic(item.topic_id);
      return `<div class="queue-item" onclick="showItemList('${item.topic_id}','${item.type}')">
        <div class="queue-item-left">
          <div class="queue-item-name">${item.question}</div>
          <div class="queue-item-sub">${topic?.name || ''} · ${item.review?.sessions || 0} reviews</div>
        </div>
        <div class="queue-item-right">
          <div class="priority-bar"><div class="priority-fill ${fillCls}" style="width:${pct}%"></div></div>
          <span class="type-tag ${item.type}">${TYPE_LABELS[item.type]}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
}

// ============================================================
// ITEM LIST VIEW
// ============================================================
let _currentTopicId = null;
let _currentType    = null;

function showItemList(topicId, type) {
  _currentTopicId = topicId;
  _currentType    = type;

  const topic = getTopic(topicId);
  showView('items');

  document.getElementById('topbarTitle').textContent = topic?.name || '';
  document.getElementById('topbarPath').innerHTML = TYPE_LABELS[type];
  document.getElementById('itemListTitle').textContent = topic?.name || '';
  const badge = document.getElementById('itemListBadge');
  badge.textContent = TYPE_LABELS[type];
  badge.className = `type-badge ${type}`;

  // Mark active folder
  document.querySelectorAll('.folder-row').forEach(r => r.classList.remove('active'));
  const folders = document.querySelectorAll(`#folders-${topicId} .folder-row`);
  const typeIdx = TYPES.indexOf(type);
  if (folders[typeIdx]) folders[typeIdx].classList.add('active');

  renderItemList();
  closeSidebar();
}

function renderItemList() {
  const items = getTopicItems(_currentTopicId, _currentType);
  const container = document.getElementById('itemListContainer');

  if (!items.length) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">◌</div>
      No ${TYPE_LABELS[_currentType].toLowerCase()} items yet.<br>Hit "+ Add" to create your first one.
    </div>`;
    return;
  }

  container.innerHTML = items.map(item => {
    const due = isDue(item);
    const sessions = item.review?.sessions || 0;
    const nrs = item.review?.nextReviewSession;
    const away = nrs ? Math.max(0, nrs - data.sessionCount) : null;
    const dueLabel = sessions === 0 ? 'new'
      : due ? 'due now'
      : away !== null ? `in ${away}s` : '';
    const dueCls = sessions === 0 ? 'new-tag' : due ? 'due-now' : '';
    const tagHtml = (item.tags || []).length
      ? item.tags.map(t => `<span class="item-tag-label">${t}</span>`).join('')
      : '';

    return `<div class="item-card" id="icard-${item.id}">
      <div class="item-card-header" onclick="toggleItemCard('${item.id}')">
        <div class="item-card-question">${item.question}</div>
        <div class="item-card-actions">
          <button class="item-action-btn" onclick="event.stopPropagation();openEditItemModal('${item.id}')">Edit</button>
          <button class="item-action-btn del" onclick="event.stopPropagation();deleteItem('${item.id}')">×</button>
        </div>
      </div>
      <div class="item-card-meta">
        ${dueLabel ? `<span class="due-tag ${dueCls}">${dueLabel}</span>` : ''}
        <span>${sessions} review${sessions !== 1 ? 's' : ''}</span>
        ${tagHtml}
      </div>
      <div class="item-card-answer">${item.answer || '<em style="color:var(--text3)">No answer yet — edit to add one.</em>'}</div>
    </div>`;
  }).join('');
}

function toggleItemCard(id) {
  document.getElementById('icard-' + id)?.classList.toggle('open');
}

// ============================================================
// ADD / EDIT / DELETE ITEMS
// ============================================================
function openAddItemModal() {
  document.getElementById('modalTitle').textContent = `Add ${TYPE_LABELS[_currentType]}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>Question</label>
      <textarea id="f-q" placeholder="Enter your question or prompt..." style="min-height:80px;"></textarea></div>
    <div class="field"><label>Answer / Reference</label>
      <textarea id="f-a" placeholder="The reference answer..." style="min-height:120px;"></textarea></div>
    <div class="field"><label>Tag (optional concept label)</label>
      <input id="f-tag" type="text" placeholder="e.g. ARP, Ethernet Switching..."></div>`;
  document.getElementById('modalSaveBtn').onclick = async () => {
    const question = document.getElementById('f-q').value.trim();
    if (!question) return;
    const answer = document.getElementById('f-a').value.trim();
    const tag = document.getElementById('f-tag').value.trim();
    const item = {
      id: uid(), topic_id: _currentTopicId, type: _currentType,
      question, answer, tags: tag ? [tag] : [],
      review: { sessions: 0, lastSession: -1, easeScore: 2.5, interval: 1, nextReviewSession: 0 }
    };
    data.items.push(item);
    await saveItem(item);
    closeModal();
    renderSidebar();
    renderItemList();
  };
  document.getElementById('modalOverlay').classList.add('open');
}

function openEditItemModal(itemId) {
  const item = getItem(itemId);
  if (!item) return;
  document.getElementById('modalTitle').textContent = `Edit ${TYPE_LABELS[item.type]}`;
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>Question</label>
      <textarea id="f-q" style="min-height:80px;">${item.question}</textarea></div>
    <div class="field"><label>Answer / Reference</label>
      <textarea id="f-a" style="min-height:120px;">${item.answer}</textarea></div>
    <div class="field"><label>Tag (optional)</label>
      <input id="f-tag" type="text" value="${(item.tags||[])[0]||''}"></div>`;
  document.getElementById('modalSaveBtn').onclick = async () => {
    item.question = document.getElementById('f-q').value.trim() || item.question;
    item.answer   = document.getElementById('f-a').value.trim();
    const tag = document.getElementById('f-tag').value.trim();
    item.tags = tag ? [tag] : [];
    await saveItem(item);
    closeModal();
    renderItemList();
  };
  document.getElementById('modalOverlay').classList.add('open');
}

async function deleteItem(itemId) {
  const item = getItem(itemId);
  if (!item) return;
  if (!confirm(`Delete this ${TYPE_LABELS[item.type]}?`)) return;
  data.items = data.items.filter(i => i.id !== itemId);
  await SB.delete('items', itemId);
  renderSidebar();
  renderItemList();
}

// ============================================================
// ADD / DELETE TOPICS
// ============================================================
function openAddTopicModal() {
  document.getElementById('modalTitle').textContent = 'Add Topic';
  document.getElementById('modalBody').innerHTML = `
    <div class="field"><label>Topic Name</label>
      <input id="f-tname" type="text" placeholder="e.g. Networking, TCP/IP, Cryptography..."></div>`;
  document.getElementById('modalSaveBtn').onclick = async () => {
    const name = document.getElementById('f-tname').value.trim();
    if (!name) return;
    const topic = { id: tuid(), name };
    data.topics.push(topic);
    await saveTopic(topic);
    closeModal();
    renderSidebar();
  };
  document.getElementById('modalOverlay').classList.add('open');
}

async function deleteTopic(topicId) {
  const topic = getTopic(topicId);
  if (!topic) return;
  const itemCount = data.items.filter(i => i.topic_id === topicId).length;
  if (!confirm(`Delete topic "${topic.name}" and all ${itemCount} items inside it?`)) return;
  const toDelete = data.items.filter(i => i.topic_id === topicId);
  for (const item of toDelete) await SB.delete('items', item.id);
  data.items = data.items.filter(i => i.topic_id !== topicId);
  await SB.delete('topics', topicId);
  data.topics = data.topics.filter(t => t.id !== topicId);
  renderSidebar();
  renderDashboard();
  showView('dashboard');
}

// ============================================================
// MODAL
// ============================================================
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

// ============================================================
// REVIEW SESSION
// ============================================================
let reviewQueue = [];
let reviewIndex = 0;
let reviewResults = { graded: 0, skipped: 0, again: 0 };
let sessionBumped = false;

function startReview(topicId = null, type = null, includeAll = false) {
  reviewQueue = buildReviewQueue(topicId, type, includeAll);
  if (!reviewQueue.length) {
    alert('Nothing to review right now.');
    return;
  }
  reviewIndex = 0;
  reviewResults = { graded: 0, skipped: 0, again: 0 };
  sessionBumped = false;

  const topic = topicId ? getTopic(topicId) : null;
  showView('review');
  document.getElementById('topbarTitle').textContent = topic ? `Review: ${topic.name}` : 'Review Session';
  document.getElementById('reviewDone').classList.remove('visible');
  document.getElementById('reviewCard').style.display = '';
  showReviewCard();
}

function showReviewCard() {
  if (reviewIndex >= reviewQueue.length) { finishReview(); return; }

  const pct = (reviewIndex / reviewQueue.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${reviewIndex + 1} / ${reviewQueue.length}`;
  document.getElementById('reviewTextarea').value = '';
  document.getElementById('gradeSection').classList.remove('visible');

  const item = reviewQueue[reviewIndex];
  const topic = getTopic(item.topic_id);
  const typePrompts = {
    atomic:         'Answer:',
    process:        'Trace:',
    problem:        'Solve:',
    reconstruction: 'Reconstruct from scratch:'
  };

  document.getElementById('reviewType').className = `review-type t-${item.type}`;
  document.getElementById('reviewType').textContent = TYPE_LABELS[item.type].toUpperCase();
  document.getElementById('reviewPrompt').textContent = item.question;
  document.getElementById('reviewContext').textContent = `${topic?.name || ''} · ${typePrompts[item.type]}`;
  document.getElementById('referenceAnswer').textContent = item.answer || 'No reference answer yet — edit this item to add one.';
}

function revealAnswer() {
  document.getElementById('gradeSection').classList.add('visible');
}

function skipCard() {
  const skipped = reviewQueue.splice(reviewIndex, 1)[0];
  skipped._skipped = true;
  reviewQueue.push(skipped);
  reviewResults.skipped++;
  if (reviewQueue.slice(reviewIndex).every(x => x._skipped)) { finishReview(); return; }
  showReviewCard();
}

async function gradeCard(grade) {
  if (!sessionBumped) { bumpSession(); sessionBumped = true; }

  const item = reviewQueue[reviewIndex];
  const live = getItem(item.id);
  if (live) {
    updateItemReview(live, grade);
    await saveItem(live);
  }

  await saveMeta();
  if (grade === 0) reviewResults.again++;
  reviewResults.graded++;
  reviewIndex++;
  document.getElementById('gradeSection').classList.remove('visible');
  renderSidebar();
  showReviewCard();
}

function finishReview() {
  document.getElementById('reviewCard').style.display = 'none';
  document.getElementById('reviewDone').classList.add('visible');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressText').textContent = 'Done';
  const streakMsg = data.streak >= 2
    ? `\n\n🔥 ${data.streak} day streak — keep it going!`
    : `\n\nDay 1 — come back tomorrow to start a streak.`;
  document.getElementById('doneSub').textContent =
    `${reviewResults.graded} reviewed · ${reviewResults.skipped} skipped · ${reviewResults.again} marked Again${streakMsg}`;
  renderDashboard();
}

// ============================================================
// STATS
// ============================================================
function renderStats() {
  if (!data.items.length) {
    document.getElementById('statsContent').innerHTML = `<div class="empty-state"><div class="empty-state-icon">◎</div>No items yet. Add topics and start filling them in.</div>`;
    return;
  }

  // Most reviewed
  const mostReviewed = [...data.items]
    .filter(i => (i.review?.sessions || 0) > 0)
    .sort((a,b) => (b.review?.sessions||0) - (a.review?.sessions||0))
    .slice(0, 5);

  const reviewedIds = new Set(mostReviewed.map(i => i.id));
  const neglected = [...data.items]
    .filter(i => !reviewedIds.has(i.id))
    .sort((a,b) => {
      if ((a.review?.sessions||0) !== (b.review?.sessions||0))
        return (a.review?.sessions||0) - (b.review?.sessions||0);
      return computePriority(b) - computePriority(a);
    })
    .slice(0, 5);

  const highlightHTML = `
    <div class="stats-highlight-grid">
      <div class="stats-highlight-box">
        <div class="stats-highlight-box-header">● Most Reviewed</div>
        ${mostReviewed.length ? mostReviewed.map(i => {
          const topic = getTopic(i.topic_id);
          return `<div class="stats-highlight-item">
            <div><div class="shi-name">${i.question.slice(0,60)}${i.question.length>60?'...':''}</div>
            <div class="shi-topic">${topic?.name||''} · ${TYPE_LABELS[i.type]}</div></div>
            <div class="shi-count">${i.review?.sessions||0}</div>
          </div>`;
        }).join('') : '<div style="padding:16px;font-size:12px;color:var(--text3);">Nothing reviewed yet.</div>'}
      </div>
      <div class="stats-highlight-box">
        <div class="stats-highlight-box-header" style="color:var(--weak);">● Most Neglected</div>
        ${neglected.length ? neglected.map(i => {
          const topic = getTopic(i.topic_id);
          return `<div class="stats-highlight-item">
            <div><div class="shi-name">${i.question.slice(0,60)}${i.question.length>60?'...':''}</div>
            <div class="shi-topic">${topic?.name||''} · ${TYPE_LABELS[i.type]}</div></div>
            <div class="shi-count neglected">${i.review?.sessions||0}</div>
          </div>`;
        }).join('') : '<div style="padding:16px;font-size:12px;color:var(--text3);">Nothing neglected.</div>'}
      </div>
    </div>`;

  const topicBlocksHTML = data.topics.map(topic => {
    const topicItems = data.items.filter(i => i.topic_id === topic.id);
    if (!topicItems.length) return '';
    const totalReviews = topicItems.reduce((s,i) => s + (i.review?.sessions||0), 0);
    const totalDueInTopic = topicItems.filter(isDue).length;

    const typeRows = TYPES.map(type => {
      const items = topicItems.filter(i => i.type === type);
      if (!items.length) return '';
      const reviews = items.reduce((s,i) => s + (i.review?.sessions||0), 0);
      const due = items.filter(isDue).length;
      return `<div class="type-stat-row">
        <div class="type-stat-label">
          <div style="width:7px;height:7px;border-radius:50%;background:${typeColor(type)};flex-shrink:0;"></div>
          ${TYPE_LABELS[type]}
          <span class="type-tag ${type}" style="margin-left:4px;">${items.length}</span>
        </div>
        <div class="type-stat-nums">
          <span><strong>${reviews}</strong>reviews</span>
          <span><strong style="color:${due>0?'var(--weak)':'var(--ok)'}">${due}</strong>due</span>
        </div>
      </div>`;
    }).join('');

    return `<div class="topic-stat-block" id="tsb-${topic.id}">
      <div class="topic-stat-header" onclick="this.parentElement.classList.toggle('open')">
        <div>
          <div class="topic-stat-name">${topic.name}</div>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <div class="topic-stat-summary">
            <span>${topicItems.length} items</span>
            <span>${totalReviews} reviews</span>
            <span style="color:${totalDueInTopic>0?'var(--weak)':'var(--ok)'};">${totalDueInTopic} due</span>
          </div>
          <span class="topic-stat-chevron">▶</span>
        </div>
      </div>
      <div class="topic-stat-body">${typeRows}</div>
    </div>`;
  }).join('');

  document.getElementById('statsContent').innerHTML = `
    ${highlightHTML}
    <div class="section-title" style="margin-top:4px;">By Topic</div>
    ${topicBlocksHTML || '<div class="empty-state">No topics yet.</div>'}`;
}

// ============================================================
// RESET
// ============================================================
async function resetAllStats() {
  const confirmed = confirm(
    'Reset all review stats?\n\nThis will zero out every item\'s session count, ease score, and interval. Your topics and items stay intact. This cannot be undone.'
  );
  if (!confirmed) return;

  const blankReview = { sessions: 0, lastSession: -1, easeScore: 2.5, interval: 1, nextReviewSession: 0 };

  // Reset every item in memory and DB
  for (const item of data.items) {
    item.review = { ...blankReview };
    await saveItem(item);
  }

  // Reset session meta
  data.sessionCount    = 0;
  data.lastSessionDate = '';
  data.streak          = 0;
  await saveMeta();

  renderSidebar();
  renderDashboard();
  closeSidebar();
  alert('Stats reset. All items are due again.');
}

// ============================================================
(async () => { await loadFromDB(); })();
